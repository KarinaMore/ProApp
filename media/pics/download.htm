    <script>
        function displayFileName(inputId) {
            var input = document.getElementById(inputId);
            var fileName = input.files[0].name;
            var label = input.closest('.fileinput').querySelector('.file-name-label');
            if (label) {
                label.innerText = fileName;
            } else {
                var p = document.createElement('p');
                p.classList.add('text-center', 'mb-0', 'file-name-label');
                p.innerText = fileName;
                input.closest('.fileinput').appendChild(p);
            }
        }
    </script>

    <!-- Include Bootstrap JS and custom JavaScript -->

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const imageInput = document.getElementById('image_data');
        const cameraButton = document.getElementById('cameraButton');
        const saveBtn = document.getElementById('save-btn');
        const submitBtn = document.getElementById('submitBtn');
        const constraints = { video: false };


        function fun() {
            if (video.style.display === 'none') {
                video.style.display = 'block';
            } else {
                video.style.display = 'none';
            }
        }




        let stream = null;
        function startCamera() {
            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    video.srcObject = stream;
                    video.style.display = 'block';
                    document.getElementById('cameraButton').style.display = 'none';
                    captureBtn.style.display = 'block';
                    saveBtn.style.display = 'block';
                })
                .catch(err => {
                    console.error('Error accessing camera:', err);
                    // alert('Error accessing camera. Please check your camera settings and try again.');
                });
        }


        cameraButton.addEventListener('click', () => {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(mediaStream => {
                    stream = mediaStream;
                    video.srcObject = mediaStream;
                    video.play();
                    video.style.display = 'block';
                })
                .catch(err => {
                    console.error('Error accessing camera:', err);
                    alert('Error accessing camera. Please check your camera settings and try again.');
                });
        });

        navigator.mediaDevices.getUserMedia(constraints)
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error('Error accessing camera:', err);
            });

        // Function to update date and time
        function updateDateTime() {
            const now = new Date();
            document.getElementById('date').value = now.toISOString().slice(0, 10);
            document.getElementById('time').value = now.toTimeString().slice(0, 8);
        }

        // Update date and time initially
        updateDateTime();

        // Update date and time every second
        setInterval(updateDateTime, 1000);

        // Function to update location (dummy implementation)
        // Update location
        function updateLocation() {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;
                    const locationElement = document.getElementById('location');
                    locationElement.value = `Latitude: ${latitude}, Longitude: ${longitude}`;
                }, error => {
                    console.error('Error getting location:', error);
                });
            } else {
                console.error('Geolocation is not supported.');
            }
        }


        // Update location initially
        updateLocation();

        // Update location every 10 seconds
        setInterval(updateLocation, 10000); // Update every 10 seconds


        // Update location initially
        updateLocation();


        captureBtn.addEventListener('click', () => {
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');
            imageInput.value = imageData;
            document.getElementById('captured-image').src = imageData;
            saveBtn.style.display = 'block';
        });

        saveBtn.addEventListener('click', () => {
            submitBtn.style.display = 'block';
            saveBtn.style.display = 'none';
        });
    </script>

    <script>
        var current = 0;
        var tabs = $(".tab");
        var tabs_pill = $(".tab-pills");

        loadFormData(current);

        function loadFormData(n) {
            $(tabs_pill[n]).addClass("active");
            $(tabs[n]).removeClass("d-none");
            $("#back_button").attr("disabled", n == 0 ? true : false);
            n == tabs.length - 1
                ? $("#next_button").text("Submit").removeAttr("onclick").attr("type", "submit")
                : $("#next_button")
                    .attr("type", "button")
                    .text("Next")
                    .attr("onclick", "next()");
        }

        function next() {
            $(tabs[current]).addClass("d-none");
            $(tabs_pill[current]).removeClass("active");

            current++;
            loadFormData(current);
        }

        function back() {
            $(tabs[current]).addClass("d-none");
            $(tabs_pill[current]).removeClass("active");

            current--;
            loadFormData(current);
        }

    </script>
