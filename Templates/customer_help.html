{% extends 'base2.html' %}
{% block content %}

<div class="container">
  <header class="mt-2">Help</header>
  <div class="wrapper">
    <div class="form">
      <h5 class="text-center">GET IN TOUCH</h5>
      <h2 class="text-center mb-3 form-headline">Send us a message</h2>
      <form id="submit-form" action="">
        <p class="full-width">
          <input id="name" class="form-input" type="text" name="your_name" placeholder="Your Name*">
          <span class="error-message"></span>
          <small class="name-error"></small>
        </p>
        <p class="full-width">
          <input id="email" class="form-input" type="email" name="your_email" placeholder="Your Email*">
          <span class="error-message"></span>
          <small class="name-error"></small>
        </p>
        <p class="full-width">
          <input id="company-name" class="form-input" type="text" name="company_name_help" placeholder="Company Name*" required>
          <span class="error-message"></span>
          <small></small>
        </p>
        <p class="full-width">
          <input id="subject" class="form-input" type="text" name="subject_help" placeholder="Subject*" required>
          <span class="error-message"></span>
          <small></small>
        </p>
      
        <select style="color:rgb(116, 116, 116) !important;" name="select_department" id="select" class="full-width form-input" placeholder="Select your Department*" required>
          <option disabled selected >Select department *</option>
          <option value="Technical Support">Technical Support</option>
          <option value="Customer Care">Customer Care</option>
          <option value="Data Management">Data Management</option>
        </select>

        <p class="full-width">
          <textarea  minlength="20" id="message" cols="30" rows="4" name="your_massage" placeholder="Your Message*" required></textarea>
          <span class="error-message"></span>
          <small></small>
        </p>
    
        <p class="full-width" style="margin-left: 100px;">
            <input type="submit" class="submit-btn" value="Submit" onclick="checkValidations()">
        </p>
      </form>
    </div>
</div>

  <style>
          div.form {
          background-color: #eee;
          }

          .submit-btn {
          float: left;
          }


          .highlight-text {
          color: #ec1c24;
          }

          .hightlight-contact-info {
          font-weight: 700;
          font-size: 22px;
          line-height: 1.5;
          }

          .highlight-text-grey {
          font-weight: 500;
          }

          .email-info {
              margin-top: 20px;
          }

          ::-webkit-input-placeholder { /* Chrome */
          font-family: 'Roboto', sans-serif;
          }

          .required-input {
          color: black;
          }
          @media (min-width: 600px) {
          .contain {
              padding: 0;
          }
          }

          h3,
          ul {
          margin: 0;
          }

          h3 {
          margin-bottom: 1rem;
          }

          .form-input:focus,
          textarea:focus{
          outline: 1.5px solid #ec1c24;
          }

          .form-input,
          textarea {
          width: 100%;
          border: 1px solid #bdbdbd;
          border-radius: 5px;
          }

          .wrapper > * {
          padding: 1em;
          }
          @media (min-width: 700px) {
          .wrapper {
              display: grid;
              grid-template-columns: 2fr 1fr;
          }
          .wrapper > * {
              padding: 2em 2em;
          }
          }

          .contacts {
          color: #212d31;
          }

          .form {
          background: #fff;
          margin-top: 0;
          }

          form {
          display: grid;
          grid-template-columns: 1fr 1fr;
          grid-gap: 20px;
          }
          form label {
          display: block;
          }

          form p {
          margin: 0;
          }

          .full-width {
          grid-column: 1 / 3;
          }

          button,
          .submit-btn,
          .form-input,
          textarea {
          padding: 6px;
          }

          button, .submit-btn {
          background: transparent;
          border: 1px solid #ec1c24;
          color: #ec1c24;
          border-radius: 15px;
          padding: 5px 20px;
          text-transform: uppercase;
          }
          button:hover, .submit-btn:hover,
          button:focus , .submit-btn:focus{
          background: #ec1c24;
          outline: 0;
          color: #eee;
          }
          .error {
          color: #ec1c24;
          }


  </style>

</div>

{% endblock %}
