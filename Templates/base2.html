    <script>
      function displayFileName(inputId) {
        var input = document.getElementById(inputId);
        var fileName = input.files[0].name;
        var label = input
          .closest(".fileinput")
          .querySelector(".file-name-label");
        if (label) {
          label.innerText = fileName;
        } else {
          var p = document.createElement("p");
          p.classList.add("text-center", "mb-0", "file-name-label");
          p.innerText = fileName;
          input.closest(".fileinput").appendChild(p);
        }
      }
    </script>

      const imageInput = document.getElementById("image_data");
      const cameraButton = document.getElementById("cameraButton");
      const saveBtn = document.getElementById("save-btn");
      const submitBtn = document.getElementById("submitBtn");
      const constraints = { video: true };

      let stream = null;
      function startCamera() {
        navigator.mediaDevices
          .getUserMedia(constraints)
          .then((stream) => {
            video.srcObject = stream;
            video.style.display = "block";
            document.getElementById("cameraButton").style.display = "none";
            captureBtn.style.display = "block";
            saveBtn.style.display = "block";
          })
          .catch((err) => {
            console.error("Error accessing camera:", err);
            alert(
              "Error accessing camera. Please check your camera settings and try again."
            );
          });
      }

      cameraButton.addEventListener("click", () => {
        navigator.mediaDevices

          })
          .catch((err) => {

      // Function to update date and time
      function updateDateTime() {
        const now = new Date();
        document.getElementById("date").value = now.toISOString().slice(0, 10);
        document.getElementById("time").value = now.toTimeString().slice(0, 8);
      }

      // Update date and time initially
      updateDateTime();

      // Update date and time every second

      // Function to update location (dummy implementation)
      // Update location
      function updateLocation() {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const latitude = position.coords.latitude;
              const longitude = position.coords.longitude;
              const locationElement = document.getElementById("location");
              locationElement.value = Latitude: ${latitude}, Longitude: ${longitude};
            },
            (error) => {
              console.error("Error getting location:", error);
            }
          );
        } else {
          console.error("Geolocation is not supported.");
        }
      }

      // Update location initially
      updateLocation();

      // Update location every 10 seconds
      setInterval(updateLocation, 10000); // Update every 10 seconds

      // Update location initially
      updateLocation();

      function closevid(event) {
        event.preventDefault(); // Prevent the default behavior of the button
        document.getElementById("video").style.display = "none"; // Hide video element
      }

      captureBtn.addEventListener("click", () => {
        canvas
          .getContext("2d")
          .drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL("image/jpeg");
        imageInput.value = imageData;
        document.getElementById("video").style.display = "none"; // Hide video element
        document.getElementById("captured-image").src = imageData;
        document.getElementById("captured-image").style.display = "block"; // Display captured image
        document.getElementById("submitBtn").style.display = "none"; // Display captured image
        document.getElementById("retake-btn").style.display = "block"; // Display captured image
        captureBtn.style.display = "none"; // Hide capture button
      });

      // Function to retake the image
      function retakeImage() {
        video.style.display = "block"; // Show video element
        document.getElementById("captured-image").style.display = "none"; // Hide captured image
        document.getElementById("retake-btn").style.display = "none"; // Hide captured image
        captureBtn.style.display = "block"; // Show capture button
        submitBtn.style.display = "none"; // Hide save button
      }

      // Event listener for retake button
      document
        .getElementById("retake-btn")
        .addEventListener("click", retakeImage);

      saveBtn.addEventListener("click", () => {
        saveBtn.style.display = "none";
      });

    <script>
      var current = 0;
      var tabs = $(".tab");
      var tabs_pill = $(".tab-pills");

      loadFormData(current);

      function loadFormData(n) {
        $(tabs_pill[n]).addClass("active");
        $(tabs[n]).removeClass("d-none");
        $("#back_button").attr("disabled", n == 0 ? true : false);

        if (n === tabs.length - 1) {
          $("#next_button").text("Submit");
        } else {
          $("#next_button").text("Next");
        }
      }

      function next() {
        // Check if all required fields in the current tab are filled
        var currentTab = $(tabs[current]);
        var isValid = true;

        currentTab.find(".error-message").text(""); // Remove any existing error messages

        currentTab.find("input[required]").each(function () {
          if (!$(this).val()) {
            isValid = false;
            // Display error message below the input field
            $(this).siblings(".error-message").text("This field is required.");
          }
        });

        // If all required fields are filled, proceed to the next tab
        if (isValid) {
          currentTab.addClass("d-none");
          $(tabs_pill[current]).removeClass("active");

          current++;
          if (current >= tabs.length) {
            $("#photoForm").submit(); // Submit the form when reaching the last tab
          } else {
            loadFormData(current);
          }
        }
      }

      function next2() {
        var currentTab = $(tabs[current]);
        var isValid = true;

        currentTab.find(".error-message").text(""); // Remove any existing error messages

        currentTab.find("input[required]").each(function () {
          if (!$(this).val()) {
            isValid = false;
            // Display error message below the input field
            $(this).siblings(".error-message").text("This field is required.");
          }
        });

        if (isValid) {
          currentTab.addClass("d-none");
          $(tabs_pill[current]).removeClass("active");

          current++;
          if (current >= tabs.length) {
            $("#back_button").hide(); // Hide the back button when reaching the last tab
            $("#next_button").hide(); // Submit the form when reaching the last tab
            $("#registerForm").submit(); // Submit the form when reaching the last tab
          } else {
            loadFormData(current);
          }
        }
      }

      function back() {
        $(tabs[current]).addClass("d-none");
        $(tabs_pill[current]).removeClass("active");

        current--;
        loadFormData(current);
      }
    </script>

    <script>
      const togglePassword = document.querySelector("#togglePassword");
      const password = document.querySelector("#password");

      togglePassword.addEventListener("click", (event) => {
        // Prevent default behavior of the link
        event.preventDefault();

        // Toggle the type attribute using getAttribute() method
        const type =
          password.getAttribute("type") === "password" ? "text" : "password";
        password.setAttribute("type", type);

        // Toggle the eye and bi-eye icon
        togglePassword.classList.toggle("bi-eye");
        togglePassword.classList.toggle("bi-eye-slash");
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const togglePassword = document.querySelectorAll(".toggle-password");

        togglePassword.forEach((icon) => {
          icon.addEventListener("click", () => {
            const targetId = icon.dataset.target;
            const passwordField = document.getElementById(targetId);

            const type =
              passwordField.getAttribute("type") === "password"
                ? "text"
                : "password";
            passwordField.setAttribute("type", type);

            // Toggle the eye and bi-eye icon classes
            icon.classList.toggle("bi-eye-slash");
            icon.classList.toggle("bi-eye");
          });
        });
      });
    </script>

    <!-- flip camera  -->

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const video = document.getElementById("video");
        const flipCameraBtn = document.getElementById("flip-camera-btn");
        let stream = null;

        // Function to toggle between front and back camera
        function toggleCamera() {
          const facingMode =
            video.srcObject?.getVideoTracks()[0].getSettings().facingMode ===
            "user"
              ? "environment"
              : "user";
          const constraints = { video: { facingMode: facingMode } };

          // Stop the current stream
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
          }

          // Get new stream with updated constraints
          navigator.mediaDevices
            .getUserMedia(constraints)
            .then((newStream) => {
              stream = newStream;
              video.srcObject = newStream;
              video.play();
            })
            .catch((err) => {
              console.error("Error accessing camera:", err);
              alert(
                "Error accessing camera. Please check your camera settings and try again."
              );
            });
        }

        // Add event listener to flip camera button
        flipCameraBtn.addEventListener("click", toggleCamera);

        // Start with the default camera (user facing)
        toggleCamera();
      });
    </script>
