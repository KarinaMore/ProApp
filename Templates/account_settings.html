{% extends 'base.html' %}
{% block content %}

<section class="container shadow-0 mt-5 pt-4" style="max-height:100vh;">
    <header>Account Settings</header>
    {% if messages %}
    {% for message in messages %}
    <h6 style="color: red;">{{ message }}</h6>
    {% endfor %}
    {% endif %}
    <form method="post" action="{% url 'change_username' %}">
        {% csrf_token %}
        <label for="notificationTitle" class="mt-3">Change Username</label>
        <div class="input-group my-3">
            <input class="form-control form_control_form rounded-start rounded-0" type="text" name="new_username" value="{{ request.user.username }}" />
            <button class="btn shadow-0 border border-dark border-1 bg-success text-light" type="submit">Change</button>
        </div>
    </form>
    <form action="{% url 'change_password' %}" method="post">
        {% csrf_token %}
        <label for="password">Change Password</label>
        <div class="input-group my-3">
            <input type="password" class="form-control form_control_form rounded-start rounded-0" id="password" name="new_password" required />
            <i class="bi bi-eye-slash" id="togglePassword"></i>
            <button class="btn shadow-0 py-2 border border-dark border-1 bg-success text-light" type="submit" style="height: 35px;">Change</button>
        </div>
    </form>
      
    <div class="row">
        <div class="col-md-6 mx-auto mt-2">
          <button class="btn btn-danger w-100" title="Delete your account" type="button"  data-bs-toggle="modal" data-bs-target="#exampleModaldeleteacc{{request.user.id}}">Delete your account</button>
          <div class="modal fade" id="exampleModaldeleteacc{{request.user.id}}" tabindex="-1"
            aria-labelledby="exampleModalLabel" aria-hidden="true" style="margin-top: 10%;">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-body text-center" style="background-color: #e0e0e0;">
                  <p><i class="fa-solid fa-circle-xmark text-danger fs-2"></i></p>
                  <p class="fs-5">Are You Sure To Delete your account ?</p>
                  <a href="{% url 'delete_account' %}">
                    <button type="button" class="btn btn-danger px-5 mx-2">yes</button>
                  </a>
                  <button type="button" class="btn btn-secondary px-5 mx-2"  type="button" data-bs-dismiss="modal">No</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
</section>

{% endblock %}
